<!doctype html>
<html lang="uk" class="theme-soft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#efeeea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="На свій лад">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>На свій лад</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Crect x='4' y='3.5' width='24' height='2.8' fill='%230a0a0a'/%3E%3Crect x='4' y='8.3' width='24' height='2.8' fill='%230a0a0a'/%3E%3Crect x='4' y='13.1' width='24' height='2.8' fill='%230a0a0a'/%3E%3Crect x='4' y='22.7' width='24' height='2.8' fill='%230a0a0a'/%3E%3Crect x='4' y='27.5' width='24' height='2.8' fill='%230a0a0a'/%3E%3Crect x='4' y='17.9' width='24' height='2.8' fill='%23d10a00' transform='rotate%28-11 16 19.3%29'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,600;62..125,800;62..125,900&family=IBM+Plex+Mono:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="mast-left">
      <div class="mast-meta">
        <span class="brand"><svg viewBox='0 0 32 32' aria-hidden='true'><rect x='4' y='3.5' width='24' height='2.8' fill='currentColor'/><rect x='4' y='8.3' width='24' height='2.8' fill='currentColor'/><rect x='4' y='13.1' width='24' height='2.8' fill='currentColor'/><rect x='4' y='22.7' width='24' height='2.8' fill='currentColor'/><rect x='4' y='27.5' width='24' height='2.8' fill='currentColor'/><rect x='4' y='17.9' width='24' height='2.8' fill='var(--red)' transform='rotate(-11 16 19.3)'/></svg>НА СВІЙ ЛАД</span>
        <span id="mast-issue"></span>
        <span class="mast-links">
          <button type="button" id="btn-sync" class="icon-link sync-btn is-off" data-tip="Акаунт і синхронізація" aria-label="Акаунт і синхронізація"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M20 11a8 8 0 0 0-14.3-4.9L4 8'/><path d='M4 3.5V8h4.5'/><path d='M4 13a8 8 0 0 0 14.3 4.9L20 16'/><path d='M20 20.5V16h-4.5'/></svg><i class="sync-dot"></i></button>
          <button type="button" id="btn-radio" class="icon-link" data-tip="Радіо" aria-label="Радіо"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M9 18V5l11-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='17' cy='16' r='3'/></svg></button>
          <button type="button" id="btn-import" class="icon-link" data-tip="Імпорт із файлу" aria-label="Імпорт із файлу"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M12 3v12'/><path d='M7 10l5 5 5-5'/><path d='M4 15v5h16v-5'/></svg></button>
          <button type="button" id="btn-export" class="icon-link" data-tip="Експорт у файл" aria-label="Експорт у файл"><svg viewBox='0 0 24 24' aria-hidden='true'><path d='M12 15V3'/><path d='M7 8l5-5 5 5'/><path d='M4 15v5h16v-5'/></svg></button>
          <button type="button" id="btn-settings" class="icon-link" data-tip="Налаштування" aria-label="Налаштування"><svg viewBox='0 0 24 24' aria-hidden='true'><circle cx='12' cy='12' r='3.2'/><path d='M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3'/></svg></button>
        </span>
      </div>
      <div class="mast-title-row">
        <h1 id="page-title"></h1>
        <div class="week-ctrl" id="week-ctrl">
          <button type="button" class="sq-btn" id="btn-prev" aria-label="Попередній тиждень">←</button>
          <button type="button" class="sq-btn" id="btn-next" aria-label="Наступний тиждень">→</button>
          <button type="button" class="sq-btn sq-wide" id="btn-today">СЬОГОДНІ</button>
        </div>
        <button type="button" class="sq-btn help-btn" id="btn-help" title="Підказки до цієї сторінки" aria-label="Підказки">?</button>
      </div>
    </div>
    <nav class="mast-nav" aria-label="Розділи">
      <button type="button" data-tab="board"><span>01</span>ДЕНЬ</button>
      <button type="button" data-tab="week"><span>02</span>ТИЖДЕНЬ</button>
      <button type="button" data-tab="year"><span>03</span>РІК</button>
      <button type="button" data-tab="goals"><span>04</span>ЦІЛІ</button>
      <button type="button" data-tab="balance"><span>05</span>БАЛАНС</button>
      <button type="button" data-tab="stats"><span>06</span><em class="nav-full">СТАТИСТИКА</em><em class="nav-short">СТАТИСТ.</em></button>
    </nav>
    <input type="file" id="file-import" accept="application/json,.json" hidden>
  </header>

  <main id="main"></main>
  <div class="grain" aria-hidden="true"></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/week.js"></script>
  <script src="js/board.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/balance.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/year.js"></script>
  <script src="js/meals.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/help.js"></script>
  <script src="js/select.js"></script>
  <script src="js/datepick.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/sync.js"></script>
</body>
</html>
